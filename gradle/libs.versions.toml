[versions]
# Build
agp = "9.1.1"
kotlin = "2.4.20"
jetbrainsKotlinJvm = "2.4.20"

# Lint
ktlint-gradle = "14.2.0"

# Android SDK
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"

# AndroidX
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-compose-annotation = "1.12.1"
androidx-core = "1.19.1"
androidx-datastore = "1.3.0"
androidx-lifecycle = "2.11.0"

# Compose
composeMultiplatform = "1.12.1"
material3 = "1.12.0-alpha03"
material = "1.10.0"

# Build config
buildkonfig = "0.23.0"

# Network
ktor = "3.6.1"
kotlinx-serialization = "1.12.0"
kotlinxImmutable = "0.5.2"
kotlinx-coroutines = "1.11.0"

# DI
metro = "1.5.2"

# Navigation
navigation3 = "1.2.0"

# Image
coil = "3.6.3"

# Logging
kermit = "2.2.0"

# Test
junit = "4.13.2"
androidx-testExt = "1.3.0"
androidx-espresso = "3.7.0"

[libraries]
# Ktor
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
ktor-client-contentNegotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Kotlinx Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Kotlinx Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Kotlinx Immutable Collections
kotlinx-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxImmutable" }

# Metro
metrox-viewmodel = { group = "dev.zacsweers.metro", name = "metrox-viewmodel", version.ref = "metro" }
metrox-viewmodel-compose = { group = "dev.zacsweers.metro", name = "metrox-viewmodel-compose", version.ref = "metro" }

# Navigation
navigation3-ui = { group = "org.jetbrains.androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodelNavigation3 = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }

# Coil
coil = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }

# Kermit
kermit ={ group = "co.touchlab", name = "kermit", version.ref = "kermit" }

# AndroidX
androidx-compose-runtimeAnnotation = { group = "androidx.compose.runtime", name = "runtime-annotation", version.ref = "androidx-compose-annotation" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "androidx-datastore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# Compose Multiplatform
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "material3" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
compose-uiTooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "composeMultiplatform" }

# Material
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Test
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-testExt-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-espresso" }

# build-logic에서 convention plugin이 사용하는 Gradle 플러그인 아티팩트
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.compose", name = "compose-gradle-plugin", version.ref = "composeMultiplatform" }
compose-compilerGradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ktlint-gradlePlugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlint-gradle" }

[plugins]
# Convention Plugins (build-logic의 gradlePlugin id와 일치해야 한다. includeBuild로 해석되므로 version은 unspecified)
proov-kmp-library = { id = "proov.kmp.library", version = "unspecified" }
proov-kmp-compose = { id = "proov.kmp.compose", version = "unspecified" }
proov-kmp-feature = { id = "proov.kmp.feature", version = "unspecified" }
proov-kmp-serialization = { id = "proov.kmp.serialization", version = "unspecified" }
proov-android-application = { id = "proov.android.application", version = "unspecified" }

# Build config (KMP 공통 BuildConfig 대체)
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }

# DI (convention plugin이 모든 모듈에 적용하며, 루트 apply false는 클래스패스 등록용이다)
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }

# Android
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

# Kotlin
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jetbrainsKotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }

# Compose
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Lint (convention plugin이 모든 모듈에 적용하며, 루트 apply false는 클래스패스 등록용이다)
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }


[bundles]
# core:network commonMain (HttpClient 설정에만 쓰는 구현 의존성)
ktor-common = [
    "ktor-client-contentNegotiation",
    "ktor-client-logging",
    "ktor-serialization-kotlinxJson",
]

# proov.kmp.compose가 모든 Compose 모듈에 공통으로 적용
compose-common = [
    "compose-runtime",
    "compose-foundation",
    "compose-material3",
    "compose-ui",
]

# proov.kmp.feature가 모든 presentation impl 모듈에 공통으로 적용
compose-feature = [
    "androidx-lifecycle-viewmodelCompose",
    "androidx-lifecycle-runtimeCompose",
    "compose-uiToolingPreview",
    "compose-components-resources",
    "metrox-viewmodel-compose",
    "kotlinx-immutable",
]
