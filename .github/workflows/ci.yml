name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# Cancel the previous run of the same branch or PR when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gate: no compilation of app code, so it finishes first.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Caches ~/.gradle (dependencies, wrapper) and the build cache.
      # Only the default branch writes the cache; PRs read it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - run: ./gradlew ktlintCheck verifyModuleDependencies

  # Runs in parallel with `check`.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - run: ./gradlew :app:androidApp:assembleDebug :app:shared:testAndroidHostTest :app:androidApp:lintDebug
